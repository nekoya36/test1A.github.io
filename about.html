<main>
  <h2>白井市のについて</h2>
  <p>
    白井市は千葉県北西部に位置し、北総線の白井駅と西白井駅があります。人口は約６万人（2025年時点）です。
市内は住宅地が中心ですが、公園や森林が多くて自然と生活が調和しています。
教育施設は市立小学校が8校、市立中学校が3校あり、学習の環境が整っています。
高校は市内には1校ありますが、隣接する市の高校へ通う生徒も多くいます。
市内には図書館や公共施設、病院なども整備されており、子育て世代や高齢者まで安心して暮らせる環境が整っています。
また、梨の産地としても知られ、地域の特産品として全国に出荷されています。
ですが商業施設がほぼないです。
  </p>
